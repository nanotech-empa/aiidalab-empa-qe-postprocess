name: Tests
on:
  pull_request:
  push:
    branches: [main]
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        aiida-core: [aiida-core==2.8.0, 'aiida-core>=2.8,<3']
    env:
      AIIDA_PATH: /tmp/empa-qe-postprocess-tests
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install app and test dependencies
        run: python -m pip install . pytest "${{ matrix.aiida-core }}"
      - run: python -m pip check
      - run: python -m pytest -q tests
