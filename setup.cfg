[metadata]
name = aiidalab-empa-qe-postprocess
version = 0.1.0
description = Lightweight AiiDAlab notebooks for Quantum ESPRESSO post-processing workflows at Empa.
long_description = file: README.md
long_description_content_type = text/markdown
url = https://github.com/nanotech-empa/aiidalab-empa-qe-postprocess
author = nanotech@surfaces laboratory, Empa
license = MIT
license_files = LICENSE.txt
classifiers =
    Development Status :: 3 - Alpha
    Operating System :: OS Independent
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3 :: Only

[options]
packages = find:
install_requires =
    aiida-core>=2.8,<3
    aiida-nanotech-empa @ git+https://github.com/nanotech-empa/aiida-nanotech-empa.git@e4b1639f3710c4daba1b315296a280e4a9d9702d
    aiida-cp2k==2.2.1
    aiida-pseudo==1.11.0
    cp2k-input-tools>=0.9.3
    aiida-quantumespresso>=5,<6
    aiidalab>=26.9.0
    aiidalab-widgets-base==3.0.1
    aiidalab-widgets-empa @ git+https://github.com/nanotech-empa/aiidalab-widgets-empa.git@8a97ed1ab7b448217ec165df3a3ba48a7495e9dc
    ipywidgets>=8,<9
    numpy
    matplotlib
    banduppy>=1,<2
    scipy>=1.10,<2
    seekpath>=1.9,<2
python_requires = >=3.12

[aiidalab]
title = Empa QE post-processing
