[metadata]
name = aiidalab-empa-qe-postprocess
version = 0.1.0
description = Lightweight AiiDAlab notebooks for Quantum ESPRESSO post-processing workflows at Empa.
long_description = file: README.md
long_description_content_type = text/markdown
url = https://github.com/nanotech-empa/aiidalab-empa-qe-postprocess
author = nanotech@surfaces laboratory, Empa
license = MIT
license_files = LICENSE.txt
classifiers =
    Development Status :: 3 - Alpha
    Operating System :: OS Independent
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3 :: Only

[options]
packages = find:
install_requires =
    aiida-core>=2.8,<3
    aiida-nanotech-empa @ git+https://github.com/nanotech-empa/aiida-nanotech-empa.git@560ce8a42564707dc54c8ec572e69ad4b88b3c2f
    aiida-cp2k @ git+https://github.com/aiidateam/aiida-cp2k.git@ee49d91f7eb1a7396cdb6f112e78ce70bbccef8a
    aiida-pseudo @ git+https://github.com/t-reents/aiida-pseudo.git@40a6870e39afb698d9de030356e8fe013b2d439b
    cp2k-input-tools>=0.9.3
    aiida-quantumespresso>=5,<6
    aiidalab>=26.9.0
    aiidalab-widgets-base @ git+https://github.com/cpignedoli/aiidalab-widgets-base.git@f2773b82017d503c40751f9c082f941eef83ee33
    aiidalab-widgets-empa @ git+https://github.com/nanotech-empa/aiidalab-widgets-empa.git@8a85258bbb449ff99c1d0ee302fd4b6ae887c254
    ipywidgets>=8,<9
    numpy
    matplotlib
    banduppy>=1,<2
    scipy>=1.10,<2
    seekpath>=1.9,<2
python_requires = >=3.12

[aiidalab]
title = Empa QE post-processing
