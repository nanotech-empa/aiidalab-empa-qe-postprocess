[metadata]
name = aiidalab-empa-qe-postprocess
version = 0.1.0
description = Lightweight AiiDAlab notebooks for Quantum ESPRESSO post-processing workflows at Empa.
long_description = file: README.md
long_description_content_type = text/markdown
url = https://github.com/nanotech-empa/aiidalab-empa-qe-postprocess
author = nanotech@surfaces laboratory, Empa
license = MIT
license_files = LICENSE.txt
classifiers =
    Development Status :: 3 - Alpha
    Operating System :: OS Independent
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3 :: Only

[options]
packages = find:
install_requires =
    aiida-core>=2.8,<3
    aiida-nanotech-empa>=1.0.0b13
    aiida-quantumespresso
    aiidalab>=24.09.0
    aiidalab-widgets-base>=3.0.0a0,<4
    aiidalab-widgets-empa>=0.2.2
    ipywidgets>=8,<9
    numpy
    matplotlib
    banduppy
    irrep
    scipy>=1.10,<2
    seekpath>=1.9,<2
python_requires = >=3.12

[aiidalab]
title = Empa QE post-processing
